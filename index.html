<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0e0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="حضور سبيدي">
<title>سبيدي | حضور وانصراف المندوبين</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0e0c;--s1:#111714;--s2:#161e1a;--s3:#1d2722;--bd:#25322b;
  --tx:#ecf3ef;--mu:#8ea197;--g:#00A86B;--g2:#19c98a;--gd:#d4af37;
  --red:#ef5350;--amb:#f5a524;--blu:#4c8dff;--r:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--tx);font-family:Cairo,'Segoe UI',Tahoma,system-ui,sans-serif;font-size:15px}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.hidden{display:none!important}
.app{display:flex;min-height:100vh}
.side{width:230px;background:var(--s1);border-left:1px solid var(--bd);padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.brand b{font-size:20px;font-weight:800;letter-spacing:.5px}
.brand small{display:block;color:var(--mu);font-size:11px;margin-top:-4px}
.nav{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--mu);font-weight:600;width:100%;text-align:right}
.nav:hover{background:var(--s2);color:var(--tx)}
.nav.on{background:rgba(0,168,107,.14);color:var(--g2)}
.nav svg{width:19px;height:19px;flex:none}
.side .foot{margin-top:auto;color:var(--mu);font-size:11px;padding:8px;display:flex;flex-direction:column;gap:8px}
.side .foot .who{word-break:break-all}
main{flex:1;min-width:0;padding:18px 22px 90px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.top h1{font-size:22px;font-weight:800}
.top .sub{color:var(--mu);font-size:13px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--s2);border:1px solid var(--bd)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--g)}
.pill.wait .dot{background:var(--amb)}.pill.off .dot{background:var(--red)}
.pill.wait{color:var(--amb)}.pill.off{color:#ff7b78}
.clock{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--gd)}
.grid{display:grid;gap:12px}
.k4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);padding:16px}
.kpi .l{color:var(--mu);font-size:12.5px;font-weight:600}
.kpi .v{font-size:28px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .h{font-size:12px;color:var(--mu)}
.kpi.g .v{color:var(--g2)}.kpi.r .v{color:var(--red)}.kpi.a .v{color:var(--amb)}.kpi.y .v{color:var(--gd)}.kpi.b .v{color:var(--blu)}
.sec{font-size:15px;font-weight:800;margin:4px 0 10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.row{display:flex;align-items:center;gap:10px}
.av{width:36px;height:36px;border-radius:10px;background:var(--s3);display:grid;place-items:center;font-weight:800;color:var(--g2);flex:none}
.nm{font-weight:700}.mu{color:var(--mu);font-size:12.5px}
.grow{flex:1;min-width:0}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:700;white-space:nowrap}
.c-g{background:rgba(0,168,107,.16);color:var(--g2)}.c-r{background:rgba(239,83,80,.15);color:#ff7b78}
.c-a{background:rgba(245,165,36,.15);color:var(--amb)}.c-b{background:rgba(76,141,255,.15);color:#86b0ff}
.c-m{background:var(--s3);color:var(--mu)}.c-y{background:rgba(212,175,55,.15);color:var(--gd)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border-radius:10px;font-weight:700;background:var(--s3);border:1px solid var(--bd);white-space:nowrap}
.btn:hover{border-color:#3a4a41}
.btn.p{background:var(--g);border-color:var(--g);color:#fff}
.btn.p:hover{background:#00bb77}
.btn.d{background:rgba(239,83,80,.12);border-color:rgba(239,83,80,.35);color:#ff7b78}
.btn.o{background:rgba(245,165,36,.1);border-color:rgba(245,165,36,.35);color:var(--amb)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.4;cursor:default}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.inp,select.inp{background:var(--s2);border:1px solid var(--bd);border-radius:10px;padding:8px 12px;outline:none;min-width:0}
.inp:focus{border-color:var(--g)}
.seg{display:inline-flex;background:var(--s2);border:1px solid var(--bd);border-radius:10px;padding:3px}
.seg button{padding:6px 14px;border-radius:8px;font-weight:700;color:var(--mu)}
.seg button.on{background:var(--g);color:#fff}
.drv{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 14px;background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);margin-bottom:8px}
.drv .times{display:flex;gap:14px;font-variant-numeric:tabular-nums;font-size:13px;color:var(--mu);margin-top:3px;flex-wrap:wrap}
.drv .times b{color:var(--tx)}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{color:var(--mu);font-weight:700;text-align:right;padding:10px 8px;border-bottom:1px solid var(--bd);white-space:nowrap;font-size:12.5px}
td{padding:10px 8px;border-bottom:1px solid var(--bd);white-space:nowrap;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer}tr.click:hover td{background:var(--s2)}
.tw{overflow-x:auto}
.pod{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:12px}
.pod .card{text-align:center;position:relative;overflow:hidden}
.pod .medal{font-size:26px}
.pod .sc{font-size:30px;font-weight:800;color:var(--gd)}
.empty{text-align:center;padding:40px 16px;color:var(--mu)}
.empty b{display:block;color:var(--tx);font-size:17px;margin-bottom:6px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.sheet{background:var(--s1);border:1px solid var(--bd);border-radius:18px;width:100%;max-width:560px;max-height:92vh;overflow:auto;padding:20px}
.sheet h3{font-size:18px;font-weight:800;margin-bottom:4px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.fg label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--mu);font-weight:600}
.fg .full{grid-column:1/-1}
.mfoot{display:flex;gap:8px;justify-content:flex-start;margin-top:16px;flex-wrap:wrap}
#toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:#222c27;border:1px solid var(--bd);padding:10px 18px;border-radius:12px;font-weight:700;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:90vw;text-align:center}
#toast.on{opacity:1}
.bottom{display:none}
/* gate: loading / login / setup */
.gate{min-height:100vh;display:grid;place-items:center;padding:20px}
.gbox{width:100%;max-width:400px;text-align:center}
.gbox img{border-radius:18px;margin-bottom:12px}
.gbox h2{font-size:22px;font-weight:800;margin-bottom:4px}
.gbox form{display:flex;flex-direction:column;gap:10px;margin-top:18px;text-align:right}
.gbox .inp{width:100%;padding:11px 14px}
.gbox .btn{width:100%;padding:11px}
.gbox .err{color:#ff7b78;font-size:13px;min-height:20px}
.gbox code{background:var(--s3);padding:2px 6px;border-radius:6px;direction:ltr;display:inline-block}
.spin{width:34px;height:34px;border:3px solid var(--s3);border-top-color:var(--g);border-radius:50%;animation:sp 0.8s linear infinite;margin:14px auto}
@keyframes sp{to{transform:rotate(360deg)}}
@media (max-width:900px){
  .side{display:none}
  main{padding:14px 12px 96px}
  .bottom{display:flex;position:fixed;bottom:0;right:0;left:0;background:var(--s1);border-top:1px solid var(--bd);z-index:40;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .bottom .nav{flex-direction:column;gap:2px;font-size:10.5px;padding:6px 2px;justify-content:center;text-align:center}
  .drv{grid-template-columns:auto 1fr}
  .drv .acts{grid-column:1/-1;justify-content:flex-start}
  .pod{grid-template-columns:1fr 1fr 1fr;gap:6px}
  .pod .sc{font-size:22px}
  .fg{grid-template-columns:1fr}
  .kpi .v{font-size:24px}
}
.printonly{display:none}.mlogo{display:none}@media (max-width:900px){.mlogo{display:block}}
@media print{.side,.bottom,.noprint,#toast,.top .row,.pill{display:none!important}body,html{background:#fff;color:#000}main{padding:0}.card{background:#fff;border-color:#ccc;color:#000}th,td{color:#000;border-color:#ccc}.printonly{display:block;margin-bottom:10px}.kpi .v{color:#000!important}.mu{color:#555}}
</style>
</head>
<body>

<div id="gate" class="gate">
  <div class="gbox"><img src="icons/icon-192.png" width="72" height="72" alt="سبيدي"><h2>سبيدي</h2><div class="mu">حضور وانصراف المندوبين</div><div class="spin"></div></div>
</div>

<div class="app hidden" id="app">
  <aside class="side">
    <div class="brand">
      <img src="icons/icon-192.png" width="44" height="44" style="border-radius:12px" alt="Speedy">
      <div><b>سبيدي</b><small>حضور المندوبين</small></div>
    </div>
    <div id="sideNav"></div>
    <div class="foot"><span class="who" id="who"></span><button class="btn sm" data-act="logout">تسجيل الخروج</button><span>سبيدي.. طلبيتك في إيدي</span></div>
  </aside>
  <main>
    <header class="top">
      <div class="row" style="gap:10px"><img class="mlogo" src="icons/icon-192.png" width="40" height="40" style="border-radius:11px" alt=""><div><h1 id="title"></h1><div class="sub" id="subtitle"></div></div></div>
      <div class="row"><span class="pill" id="sync"><span class="dot"></span><span></span></span><span class="clock" id="clock"></span></div>
    </header>
    <section id="view"></section>
  </main>
</div>
<nav class="bottom hidden" id="botNav"></nav>
<div id="modal" class="modal hidden"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
